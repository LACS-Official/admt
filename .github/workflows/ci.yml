name: "CI"

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: install frontend dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        run: npm run test:run

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: build frontend assets
        run: npm run build
