name: "Release"

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        run: npm run test:run

      - name: build frontend assets
        run: npm run build

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ADMT ${{ github.ref_name }}"
          releaseBody: "Automated Windows release for ADMT ${{ github.ref_name }}."
          releaseDraft: false
          prerelease: false

      # 发版约定：docs/updates/<去掉 v 的版本号>.md 即该版本 Release 正文。
      # 优先取 master 上的文档（兼容先打 tag 后补日志），其次取 tag commit 自带的文档。
      - name: Sync changelog to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="docs/updates/${version}.md"
          git fetch --no-tags origin master
          git show "origin/master:$file" > "$file.from-master" 2>/dev/null || true
          if [ -s "$file.from-master" ]; then
            notes="$file.from-master"
          elif [ -f "$file" ]; then
            notes="$file"
          else
            notes=""
          fi
          if [ -n "$notes" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
            echo "Release notes synced from $notes"
          else
            echo "::warning::$file not found; keeping default release body."
          fi
