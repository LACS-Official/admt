[package]
name = "admt-lacs"
version = "1.0.4"
description = "Android设备跨平台全能管家"
authors = ["领创工作室"]
repository = ""
edition = "2021"
rust-version = "1.77.2"

# Windows 元数据，用于管理员权限
[package.metadata.win.manifest]
resource = "assets/manifest.xml"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }
chrono = { version = "0.4", features = ["serde"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.7.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
base64 = "0.21"
futures-util = "0.3"
futures = "0.3"
dirs = "5.0"
zip = "0.6"
sevenz-rust = "0.5"
tauri-plugin-process = "2.3.0"
hostname = "0.3"
once_cell = "1.19"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Windows平台特有依赖，用于进程控制
winapi = { version = "0.3", features = ["processthreadsapi", "winbase", "winuser", "handleapi", "winnt"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
