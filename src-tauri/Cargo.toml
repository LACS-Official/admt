[package]
name = "admt-lacs"
version = "1.5.6"
description = "Android设备跨平台全能管家"
authors = ["领创工作室"]
repository = ""
edition = "2021"
rust-version = "1.77.2"

# Windows 元数据，用于管理员权限
[package.metadata.win.manifest]
resource = "assets/manifest.xml"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 用 chrono 生成 BUILD_DATE；与 [dependencies] 的 chrono 各自独立，不可合并
chrono = { version = "0.4", features = ["serde"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
base64 = "0.22"
mdns-sd = "0.11"
rand = "0.9"
futures-util = "0.3"
dirs = "5.0"
zip = "0.6"
lzma-rs = "0.3.0"
sevenz-rust = "0.5"
tauri-plugin-process = "2"
hostname = "0.3"
once_cell = "1.19"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
# Windows 下提供 ConPTY，Unix 下提供原生 pty；用于内置交互式终端
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Windows平台特有依赖，用于进程控制
winapi = { version = "0.3", features = ["processthreadsapi", "winbase", "winuser", "handleapi", "winnt"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
notify = "6.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
